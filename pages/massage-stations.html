<!-- pages/massage-stations.html - compact massage stations view -->
<div class="stations-container massage-stations-page" data-stations-room-filter="sala21">
    <div class="stations-header">
        <div class="stations-header-left">
            <h1 class="stations-title">
                <i class="fas fa-hands"></i>
                Masaż - Sala 21
            </h1>
            <p class="stations-subtitle">Dwa stanowiska do masażu</p>
        </div>
        <div class="stations-header-right">
            <div class="status-legend">
                <div class="legend-item">
                    <span class="legend-dot free"></span>
                    <span>Wolne</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot occupied"></span>
                    <span>Zajęte</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot finished"></span>
                    <span>Koniec</span>
                </div>
            </div>
            <button id="toggleSoundBtn" class="sound-toggle-btn" title="Włącz/Wyłącz dźwięk" aria-label="Dźwięk">
                <i class="fas fa-volume-up"></i>
            </button>
            <button id="toggleRadioBtn" class="sound-toggle-btn toggle-radio-btn" title="Włącz/Wyłącz radio" aria-label="Radio" aria-pressed="false">
                <i class="fas fa-broadcast-tower"></i>
            </button>
            <button id="refreshStationsBtn" class="sound-toggle-btn refresh-btn" title="Odśwież" aria-label="Odśwież">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button id="stationsZenBtn" class="sound-toggle-btn stations-zen-btn" title="Tryb pełnego ekranu" aria-label="Tryb pełnego ekranu" aria-pressed="false">
                <i class="fas fa-expand-alt"></i>
            </button>
        </div>
    </div>

    <div id="stationsAttentionBar" class="stations-attention-bar" aria-live="polite" style="display: none !important;"></div>

    <div class="stations-radio-widget-panel" aria-label="Radio online">
        <div class="stations-radio-player" id="stationsRadioPlayer">
            <div class="stations-radio-top">
                <button id="stationsRadioPlayBtn" class="stations-radio-play-btn" type="button" aria-label="Odtwórz radio">
                    <i class="fas fa-play"></i>
                </button>
                <div class="stations-radio-meta">
                    <span id="stationsRadioName" class="stations-radio-name">ESKA Warszawa</span>
                    <span id="stationsRadioStatus" class="stations-radio-status">Gotowe do odtwarzania</span>
                </div>
            </div>
            <div id="stationsRadioStationList" class="stations-radio-station-list" aria-label="Stacje radiowe"></div>
        </div>
    </div>

    <div class="stations-mobile-view" id="stationsMobileView"></div>
    <div class="stations-desktop-view" id="stationsDesktopView"></div>
</div>
